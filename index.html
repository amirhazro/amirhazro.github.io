<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>amirhazro apps</title>
<style>
:root{--bg:#fbfaf7;--fg:#1b1d1f;--muted:#5b6066;--line:#e3e1dc;--link:#1f5fbf}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141516;--fg:#ecebe8;--muted:#a3a7ab;--line:#2c2e30;--link:#8ab4f8}}
:root[data-theme="dark"]{--bg:#141516;--fg:#ecebe8;--muted:#a3a7ab;--line:#2c2e30;--link:#8ab4f8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:1.75rem;line-height:1.25;margin:0 0 4px}
h2{font-size:1.15rem;margin:32px 0 8px}
p,li{color:var(--fg)}
.meta{color:var(--muted);margin:0 0 24px}
a{color:var(--link)}
ul{padding-left:20px}
footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
.apps a{display:block;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none}
@media print{body{background:#fff;color:#000}a{color:#000}}
</style>
</head>
<body>
<main>
<h1>amirhazro apps</h1>
<p class="meta">Small, private Android apps by an independent developer.</p>
<div class="apps">
<a href="pixelfit/privacy/">PixelFit — privacy policy</a>
<a href="quietswitch/privacy/">QuietSwitch — privacy policy</a>
</div>
<h2>Support</h2>
<p>Email <a href="mailto:amirhazro@gmail.com">amirhazro@gmail.com</a> with the app name in the subject.</p>
</main>
</body>
</html>
